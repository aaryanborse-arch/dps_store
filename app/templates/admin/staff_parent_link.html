<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parent Shop Link - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Parent Shop Link - {{ city.name }}</h2>
            <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
        </div>

        <div class="card p-4">
            {% set link = request.url_root.rstrip('/') + url_for('parent.select_class', city_id=city.id) %}
            <p class="text-muted">Share this link with parents to buy online:</p>
            <div class="d-flex gap-2">
                <input type="text" id="linkBox" class="form-control" value="{{ link }}" readonly>
                <button type="button" class="btn btn-outline-primary" onclick="copyLink()">Copy</button>
            </div>
        </div>
    </div>

    <script>
    function copyLink() {
        const box = document.getElementById('linkBox');
        navigator.clipboard.writeText(box.value).then(() => {
            alert('Link copied!');
        });
    }
    </script>
</body>
</html>
