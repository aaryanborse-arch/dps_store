<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Correction - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Stock Correction</h2>
            <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
        </div>
        <p class="text-muted">Only for genuine errors (damage, miscounts). Every correction is logged with a reason in the Activity Log.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">{% for m in messages %}<p class="mb-0">{{ m }}</p>{% endfor %}</div>
            {% endif %}
        {% endwith %}

        <div class="card p-3 mb-4">
            <form method="GET">
                <label class="form-label mb-0">School</label>
                <select name="city_id" class="form-select" style="max-width:300px" onchange="this.form.submit()">
                    {% for c in all_cities %}
                    <option value="{{ c.id }}" {{ 'selected' if selected_city_id == c.id|string }}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <div class="card p-4">
            <form method="POST" class="row g-2">
                <input type="hidden" name="city_id" value="{{ selected_city_id }}">
                <div class="col-md-4">
                    <select name="product_id" class="form-select" required>
                        <option value="">Select Product</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} — [{{ p.display_label }}] (Current: {{ p.stock_quantity }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="new_quantity" class="form-control" placeholder="New Quantity" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="reason" class="form-control" placeholder="Reason (required)" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-danger w-100">Apply Correction</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
