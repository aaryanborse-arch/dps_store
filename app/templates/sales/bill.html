<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bill {{ bill.bill_number }} - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    
</head>
<body class="bg-light">
    <div class="container mt-5 no-print">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Bill: {{ bill.bill_number }}</h2>
            <div>
                
                <a href="{{ url_for('sales.print_bill_three_copies', bill_id=bill.id) }}" target="_blank" class="btn btn-primary">🖨️ Print Tax Invoice (3 Copies)</a>
                <a href="{{ url_for('sales.download_bill', bill_id=bill.id) }}" class="btn btn-success">Download PDF</a>
                <a href="{{ url_for('sales.download_bill_excel', bill_id=bill.id) }}" class="btn btn-success">Download Excel</a>
                <a href="{{ url_for('sales.counter_sale') }}" class="btn btn-primary">New Sale</a>
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>

        <div class="card p-2">
            <iframe src="{{ url_for('sales.view_bill_pdf', bill_id=bill.id) }}" style="width:100%; height:85vh; border:none;"></iframe>
        </div>
    </div>

    

</body>
</html>
