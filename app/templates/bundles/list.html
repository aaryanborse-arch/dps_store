<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Bundles - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Class Bundles</h2>
            <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
        </div>
        <p class="text-muted">Build the fixed set of books/notebooks each class receives. Parents will get exactly this bundle — no picking items individually.</p>

        <div class="row g-4">
            {% for s in summary %}
            <div class="col-md-3 mb-4">
                <a href="{{ url_for('bundles_bp.bundle_edit', class_value=s.class_value) }}" class="text-decoration-none">
                    <div class="card p-3 text-center h-100">
                        <h5>Class {{ s.label }}</h5>
                        <span class="badge bg-primary">{{ s.count }} item(s) in bundle</span>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
