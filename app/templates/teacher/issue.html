<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Item - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Issue Item to Student</h2>
            <div>
                <a href="{{ url_for('teacher_bp.my_history') }}" class="btn btn-secondary">My Issue History</a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Logout</a>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">{% for m in messages %}<p class="mb-0">{{ m }}</p>{% endfor %}</div>
            {% endif %}
        {% endwith %}

        <div class="card p-4">
            <form method="POST" class="row g-2">
                <div class="col-md-4">
                    <select name="product_id" class="form-select" required>
                        <option value="">Select Item</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Stock: {{ p.stock_quantity }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantity" class="form-control" placeholder="Quantity" min="1" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="student_name" class="form-control" placeholder="Student Name" required>
                </div>
                <div class="col-md-2">
                    <select name="student_class" class="form-select">
                        <option value="">Class (opt.)</option>
                        {% for c in class_options %}
                        <option value="{{ c }}">{{ c|roman }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Issue</button>
                </div>
                <div class="col-md-12">
                    <input type="text" name="notes" class="form-control" placeholder="Notes (optional — reason, purpose, etc.)">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
