<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Issue History - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Issue History</h2>
            <div>
                <a href="{{ url_for('teacher_bp.issue_item') }}" class="btn btn-primary">Issue New Item</a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-danger">Logout</a>
            </div>
        </div>

        <table class="table table-bordered bg-white">
            <thead>
                <tr><th>Date</th><th>Item</th><th>Qty</th><th>Student</th><th>Class</th><th>Notes</th></tr>
            </thead>
            <tbody>
                {% for r in records %}
                <tr>
                    <td>{{ r.issued_at.strftime('%d-%m-%Y %H:%M') }}</td>
                    <td>{{ r.product_name }}</td>
                    <td>{{ r.quantity }}</td>
                    <td>{{ r.student_name }}</td>
                    <td>{{ r.student_class or '-' }}</td>
                    <td>{{ r.notes or '-' }}</td>
                </tr>
                {% else %}
                <tr><td colspan="6" class="text-center text-muted">No items issued yet</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
