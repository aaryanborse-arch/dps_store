<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shipment History - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Shipment History - {{ active_city.name }}</h2>
            <div>
                <a href="{{ url_for('supplier_import.upload') }}" class="btn btn-primary">Import New Invoice</a>
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>

        <table class="table table-bordered bg-white">
            <thead><tr><th>Date</th><th>Supplier</th><th>Invoice No.</th><th>Items</th><th></th></tr></thead>
            <tbody>
                {% for r in records %}
                <tr>
                    <td>{{ r.created_at.strftime('%d-%m-%Y') }}</td>
                    <td>{{ r.supplier.name }}</td>
                    <td>{{ r.invoice_number or '-' }}</td>
                    <td>{{ r.items|length }}</td>
                    <td><a href="{{ url_for('supplier_import.view_record', record_id=r.id) }}" class="btn btn-sm btn-outline-primary">View</a></td>
                </tr>
                {% else %}
                <tr><td colspan="5" class="text-center text-muted">No shipments imported yet</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
