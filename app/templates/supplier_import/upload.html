<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Import Supplier Invoice - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Import Supplier Invoice</h2>
            <div>
                <a href="{{ url_for('supplier_import.history') }}" class="btn btn-secondary">Shipment History</a>
                <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Dashboard</a>
            </div>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">{% for m in messages %}<p class="mb-0">{{ m }}</p>{% endfor %}</div>
            {% endif %}
        {% endwith %}

        <div class="card p-4">
            <form method="POST" enctype="multipart/form-data">
                <div class="row g-2 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Supplier Name</label>
                        <input type="text" name="supplier_name" class="form-control" list="supplier-list" required>
                        <datalist id="supplier-list">
                            {% for s in suppliers %}<option value="{{ s.name }}">{% endfor %}
                        </datalist>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Invoice Number</label>
                        <input type="text" name="invoice_number" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Invoice Date</label>
                        <input type="date" name="invoice_date" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Supplier Invoice File (Excel or PDF)</label>
                    <input type="file" name="invoice_file" class="form-control" accept=".xlsx,.xls,.pdf" required>
                </div>
                <button type="submit" class="btn btn-primary">Analyze Invoice</button>
            </form>
        </div>
    </div>
</body>
</html>
