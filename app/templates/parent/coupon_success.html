<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coupon Confirmed - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow text-center" style="width: 420px;">
                <h3 class="text-success mb-3">Coupon Confirmed ✅</h3>
                <p>Amount: <strong>₹{{ coupon.amount }}</strong></p>
                <p class="mb-3">Show this OTP at the canteen counter:</p>
                <h1 class="display-4 text-primary">{{ coupon.otp_code }}</h1>
                <a href="{{ url_for('parent.select_city') }}" class="btn btn-primary mt-3">Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
