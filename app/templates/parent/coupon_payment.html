<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pay for Coupon - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow text-center" style="width: 420px;">
                <h4 class="mb-3">Complete Payment</h4>
                <p class="mb-1">Coupon Amount</p>
                <h2 class="text-primary mb-4">₹{{ amount|int }}</h2>

                <a href="{{ jodo_link }}" target="_blank" class="btn btn-success btn-lg mb-3">Proceed to Jodo Payment →</a>
                <p class="text-muted small mb-4">Please enter ₹{{ amount|int }} manually on the Jodo payment page, then come back here and confirm below.</p>

                <form method="POST" action="{{ url_for('coupons.coupon_confirm_payment') }}">
                    <button type="submit" class="btn btn-primary w-100">I've Completed the Payment</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
