<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DPS School Store - Select School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1>DPS School Store</h1>
            <p class="text-muted">Select your school to start shopping</p>
        </div>
        <div class="row justify-content-center">
            {% for city in cities %}
            <div class="col-md-3 mb-3">
                <a href="{{ url_for('parent.select_class', city_id=city.id) }}" class="btn btn-outline-primary btn-lg w-100 py-4">
                    {{ city.name }}
                </a>
            </div>
            {% else %}
            <p class="text-center text-muted">No cities available right now.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
