<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Class - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow" style="width: 420px;">
                <h4 class="text-center mb-3">{{ city.name }} Branch</h4>
                <p class="text-muted text-center">Enter your Admission Number</p>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-danger">{% for m in messages %}<p class="mb-0">{{ m }}</p>{% endfor %}</div>
                    {% endif %}
                {% endwith %}

                <div id="step1">
                    <input type="text" id="admissionNumberInput" class="form-control mb-3" placeholder="Admission Number">
                    <button type="button" class="btn btn-primary w-100" onclick="findStudent()">Find Student</button>
                    <div id="lookupError" class="text-danger small mt-2"></div>
                </div>

                <div id="step2" class="d-none">
                    <div class="card p-3 mb-3" style="background:#f2f6fb;">
                        <div class="d-flex justify-content-between"><span class="text-muted">Name</span><strong id="dispName"></strong></div>
                        <div class="d-flex justify-content-between"><span class="text-muted">Class</span><strong id="dispClass"></strong></div>
                    </div>
                    <form method="POST" id="confirmForm">
                        <input type="hidden" name="admission_number" id="hiddenAdmNo">
                        <input type="hidden" name="student_name" id="hiddenName">
                        <input type="hidden" name="student_class" id="hiddenClass">
                        <button type="submit" class="btn btn-primary w-100">Continue</button>
                    </form>
                    <button type="button" class="btn btn-link w-100" onclick="resetLookup()">Search a different Admission No.</button>
                </div>

                <a href="{{ url_for('parent.select_city') }}" class="text-center mt-2 d-block">← Back to school selection</a>
            </div>
        </div>
    </div>

    <script>
    function findStudent() {
        const admissionNumber = document.getElementById('admissionNumberInput').value.trim();
        const errorBox = document.getElementById('lookupError');
        errorBox.textContent = '';

        if (!admissionNumber) {
            errorBox.textContent = 'Please enter an Admission Number.';
            return;
        }

        fetch(`{{ url_for('parent.lookup_student') }}?city_id={{ city.id }}&admission_number=${encodeURIComponent(admissionNumber)}`)
            .then(res => res.json())
            .then(data => {
                if (!data.found) {
                    errorBox.textContent = 'Admission Number not found. Please check and re-enter.';
                    return;
                }
                document.getElementById('dispName').textContent = data.name;
                document.getElementById('dispClass').textContent = data.student_class;
                document.getElementById('hiddenAdmNo').value = admissionNumber;
                document.getElementById('hiddenName').value = data.name;
                document.getElementById('hiddenClass').value = data.student_class;
                document.getElementById('step1').classList.add('d-none');
                document.getElementById('step2').classList.remove('d-none');
            })
            .catch(() => {
                errorBox.textContent = 'Something went wrong — please try again.';
            });
    }

    function resetLookup() {
        document.getElementById('admissionNumberInput').value = '';
        document.getElementById('step2').classList.add('d-none');
        document.getElementById('step1').classList.remove('d-none');
    }
    </script>
    {% include 'parent/_footer.html' %}
</body>
</html>
