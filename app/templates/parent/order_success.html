<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow text-center" style="width: 450px;">
                <h3 class="text-success mb-3">Order Confirmed ✅</h3>
                <p>Order Number: <strong>{{ order.order_number }}</strong></p>
                <p class="mb-3">Show this OTP at the store counter to collect your order:</p>
                <h1 class="display-4 text-primary">{{ order.otp_code }}</h1>
                <p class="text-muted mt-3">Total Paid: ₹{{ order.total_amount }}</p>
                <a href="{{ url_for('parent.select_city') }}" class="btn btn-primary mt-3">Back to Home</a>
            </div>
        </div>
    </div>
    {% include 'parent/_footer.html' %}
</body>
</html>
