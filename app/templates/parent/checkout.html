<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow" style="width: 450px;">
                <h4 class="mb-3">Checkout ({{ cart_count }} item(s))</h4>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert alert-danger">{% for m in messages %}<p class="mb-0">{{ m }}</p>{% endfor %}</div>
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Parent Name</label>
                        <input type="text" name="parent_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parent Phone</label>
                        <input type="text" name="parent_phone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="parent_email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="student_name" class="form-control" value="{{ student_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Admission Number</label>
                        <input type="text" name="admission_number" class="form-control" value="{{ admission_number }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                            <select name="payment_method" class="form-select" required>
                                <option value="">Select Payment Method</option>
                                <option value="Cash">Cash (pay at store on collection)</option>
                                <option value="Card">Card</option>
                                <option value="UPI">UPI</option>
                            </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Pay & Place Order (Simulated)</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
