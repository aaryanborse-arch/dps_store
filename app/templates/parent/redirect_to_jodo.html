<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to Payment - DPS School Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-center">
            <div class="card p-4 shadow text-center" style="width: 420px;">
                <h4 class="mb-3">Ready to Pay</h4>
                <p class="text-muted">Click the button below to open the payment page in a new tab.</p>
                <a href="{{ jodo_url }}" target="_blank" id="jodoLink" class="btn btn-success btn-lg mt-2" onclick="startWaiting()">Open Payment Page →</a>
            </div>
        </div>
        <div class="d-flex justify-content-center mt-4">
            <p class="text-danger fw-bold text-center" style="font-size: 1.3rem; max-width: 500px;">
                Please wait a few seconds after paying — it's processing...<br>
                Once done, come back to THIS PAGE to collect your OTP.
            </p>
        </div>
    </div>

    <script>
        function startWaiting() {
            setTimeout(function() {
                window.location.href = "{{ url_for('parent.payment_status') }}";
            }, 1500);
        }
    </script>
    {% include 'parent/_footer.html' %}
</body>
</html>
